name: Fork · Test de Claude

# Vérifie que Claude démarre en CI avec le secret CLAUDE_CODE_OAUTH_TOKEN (ou ANTHROPIC_API_KEY),
# et affiche sa réponse ou son erreur en entier. Un tout petit message, sans outil : quasi gratuit.
# Lancer : Actions › « Fork · Test de Claude » › Run workflow (ou `gh workflow run "Fork · Test de Claude"`).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/fork-claude-check.yml

permissions:
  contents: read

jobs:
  check:
    name: Claude répond ?
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: true
          claude_args: |
            --max-turns 1
          prompt: Réponds seulement « OK Claude marche ».
